services:
  web:
    build: .
    platform: linux/amd64
    command: tail -f /dev/null
    # command: bundle exec rails s -b '0.0.0.0'
    volumes:
      - .:/app
    ports:
      - "3001:3000"
    depends_on:
      - db
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 3306

  db:
    image: mysql:5.7
    platform: linux/amd64
    ports:
      - "6606:3306"
    environment:
      MYSQL_DATABASE: sb
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
